name: openbadgeslib
channels:
  - conda-forge
  - defaults
dependencies:
  # Runtime
  - python>=3.10
  - pycryptodome>=3.20
  - ecdsa>=0.19
  - pypng>=0.20220715.0
  - pyjwt>=2.8          # PyJWT[crypto] — 'crypto' extra not supported in conda
  - cryptography        # required by pyjwt[crypto]
  - defusedxml>=0.7     # hardened XML parsing of untrusted SVG badges

  # Development / testing
  - pytest>=8.0
  - pytest-cov>=5.0

  # Install the library itself in editable mode (with the dev extras:
  # flake8, mypy, pdoc — the docs are the GitHub Wiki + a pdoc API site).
  - pip
  - pip:
    - -e ".[dev]"
