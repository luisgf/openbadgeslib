name: openbadgeslib
channels:
  - conda-forge
  - defaults
dependencies:
  # Runtime — must mirror [project] dependencies in pyproject.toml (a gate in
  # tests/test_docs.py fails if the two drift). pycryptodome and python-ecdsa
  # were dropped in the #167 port to `cryptography` (python-ecdsa also carried a
  # permanent pip-audit flag, CVE-2024-23342 "Minerva"); nothing here may bring
  # them back.
  - python>=3.10
  - pypng>=0.20220715.0
  # PyJWT[crypto] — the 'crypto' extra is not supported in conda, hence the
  # separate cryptography line below. The >=2.15.1 floor is a security floor:
  # the OB3 JWT-VC verifier reads untrusted input with get_unverified_header(),
  # an unverified jwt.decode() peek and a signature-verifying jwt.decode(), so
  # CVE-2026-32597 (crit validation), CVE-2026-48525 (b64=false payload DoS),
  # the uncaught RecursionError on a deeply nested header (GHSA-8wjv-2p76-3863)
  # or payload (GHSA-42vr-xj54-vc7v) and non-canonical segments
  # (GHSA-hxm8-2xgr-2p9m) are on a reachable path. 2.15.1 is the tested
  # release; pyproject.toml explains the choice over 2.15.0.
  - pyjwt>=2.15.1
  - cryptography>=50    # required by pyjwt[crypto]; a security floor, see pyproject.toml
  - defusedxml>=0.7     # hardened XML parsing of untrusted SVG badges

  # Development / testing
  - pytest>=8.0
  - pytest-cov>=5.0

  # Install the library itself in editable mode (with the dev extras:
  # flake8, mypy, pdoc — the docs are the GitHub Wiki + a pdoc API site —
  # and the optional ldp extra: pyld, for Data Integrity verification).
  - pip
  - pip:
    - -e ".[dev,ldp]"
