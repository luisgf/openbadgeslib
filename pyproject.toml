[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openbadgeslib"
dynamic = ["version"]
description = "Production-ready Python library & CLI for Open Badges 3.0 (W3C Verifiable Credentials): issue, verify, and revoke JWT-VC credentials with Bitstring Status Lists and did:web — plus strict OB 2.0 and legacy OB 1.0."
readme = "README.md"
license = { text = "LGPLv3" }
authors = [
    { name = "Luis González Fernández", email = "luisgf@luisgf.es" },
    { name = "Jesús Cea Avión", email = "jcea@jcea.es" },
]
keywords = [
    "openbadges", "open-badges", "verifiable-credentials", "vc-jwt", "w3c-vc",
    "digital-credentials", "did", "did-web", "bitstring-status-list",
    "revocation", "ob3", "credentials", "ed25519", "cryptography",
    "data-integrity", "eddsa",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
    "Topic :: Education",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
    "Natural Language :: Spanish",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
]
requires-python = ">=3.10"
dependencies = [
    "pypng>=0.20220715.0",
    # PyJWT floor at 2.15.1. The OB3 JWT-VC verifier parses an untrusted badge
    # three ways (ob3/verifier.py, verify.py): jwt.get_unverified_header(), a
    # jwt.decode(verify_signature=False) peek that reads the issuer before its
    # key is resolved, and the signature-verifying jwt.decode(). So the PyJWT
    # advisories on those calls are on a reachable path:
    #   * 2.12.0/2.13.0: RFC 7515 §4.1.11 `crit` validation (CVE-2026-32597)
    #     and the b64=false unencoded-payload DoS (CVE-2026-48525);
    #   * 2.14.0: a deeply nested header escaped as a bare RecursionError
    #     instead of DecodeError (GHSA-8wjv-2p76-3863, affects 2.13.0, our old
    #     floor), and compact segments with characters outside the base64url
    #     alphabet decoded, so one signature verified under many spellings of
    #     the token (GHSA-hxm8-2xgr-2p9m). Its raw-token revocation bypass needs
    #     a consumer that indexes revocation by the token text, which
    #     openbadgeslib does not do, but it is the same malleability v4.6.0
    #     closed in the native _jws decoder;
    #   * 2.15.0: the same RecursionError from a deeply nested payload, through
    #     exactly the verify_signature=False peek above (GHSA-42vr-xj54-vc7v,
    #     affects <=2.14.0). This one is why 2.14 is not enough.
    # 2.15.1 rather than 2.15.0: it is the release the suite is tested against,
    # and it settles which tokens decode. 2.14.0 and 2.15.0 also refused a
    # segment with the canonical trailing `=` padding (PyJWT #1209); 2.15.1
    # accepts that again and still rejects non-alphabet bytes and non-zero
    # trailing bits, the rule the native _jws decoder applies. With the floor
    # here, what the OB3 verifier accepts does not depend on which 2.15.x the
    # resolver picks.
    # The HMAC key-confusion advisories (GHSA-ffc3-869f-jxw9 and its 2.14.0
    # siblings) are not reachable: the verifier pins its algorithms to the key
    # type and no HS* algorithm is ever allowed. Neither is the options-dict
    # mutation (GHSA-gvp8-978c-rx2q: every call passes a fresh dict) nor any
    # PyJWKClient one (it is not used). The native _jws engine never calls
    # jwt.decode, but the OB3 path does.
    "PyJWT[crypto]>=2.15.1",
    # Floor at 50.0.0, the first release with no known advisory. The old floor,
    # 45, named 45.0.0, which is yanked on PyPI, and every release before 50.0.0
    # carries at least one advisory that a scan of the floor reports (the audit
    # workflow's declared-floors job). Fixed in:
    #   * 46.0.5: CVE-2026-26007 (no subgroup check for SECT curves);
    #   * 46.0.6: CVE-2026-34073 (DNS name constraints not applied to peer names);
    #   * 46.0.7: CVE-2026-39892 (non-contiguous buffers overflow);
    #   * 48.0.1: GHSA-537c-gmf6-5ccf (the OpenSSL bundled in the wheels);
    #   * 49.0.0: CVE-2026-69248 (wildcard SANs escape permittedSubtrees) and
    #     CVE-2026-69249 (duplicate self-signed intermediates make path
    #     building exponential);
    #   * 50.0.0: CVE-2026-69247 (a Bleichenbacher oracle in PKCS#7 decryption).
    # One of those is reachable. The X.509 path of the [eudi] track
    # (verify_badge_sd_jwt(x5c_trust_anchors=...), which hands the chain to
    # openvc-core's PolicyBuilder verifier) builds paths over the `x5c` header of
    # the untrusted badge, before its signature is checked, so CVE-2026-69249 is
    # a CPU denial of service: a 4 KB token with six chain entries stalled the
    # call for over 45 s on 45.0.0 and takes 0.1 s on 50.0.0. No integrity
    # impact, and a verifier given `pubkey_pem` never builds a path. The rest
    # are not reachable: openvc-core uses only the client verifier, with no peer
    # name, and binds the issuer by exact SAN match; the JWS engines and the
    # verifiers fix the algorithm to P-256/P-384/Ed25519/RSA before a key
    # operates (a SECT curve parses and is refused); nothing passes a strided
    # buffer or calls pkcs7_decrypt_*; and the bundled OpenSSL serves none of
    # the affected APIs (TLS runs on the interpreter's ssl module).
    # 50.0.0 rather than 49.0.0, which closes the reachable one: it is the first
    # release a scanner reports nothing for, so the floor can be audited
    # without an ignore list, and it costs no platform support the other does
    # not: the wheel matrix changed at 49.0.0, which dropped macOS x86_64 and
    # 32-bit Windows (an Intel Mac already resolves to 50.x and builds it with
    # Rust; the floor only removes the cryptography<49 way out). 50.0.0 needs
    # Python 3.9, so 3.10-3.15 is covered, and nothing above it caps it:
    # openvc-core asks cryptography>=45 (>=48 for its [pq] extra), PyJWT[crypto] >=3.4.
    # The distros that ship cryptography 45-49 (Ubuntu 26.04, Fedora 43, Alpine
    # 3.23/3.24, Debian testing) no longer satisfy it, but none packages
    # openbadgeslib (Repology lists it on PyPI only), so it is installed with
    # pip, which has wheels.
    # keys.py keeps catching both exception contracts for an unsupported key
    # (ValueError up to 46, UnsupportedAlgorithm from 47, #244); with the floor
    # past that change the second is the one raised.
    "cryptography>=50",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
# Issuing and verifying Data Integrity (Linked Data Proof) credentials needs a
# JSON-LD processor for RDF canonicalization; everything else works without it.
# Floor at 3.3.0, the release the suite is tested against, because what pyld
# produces is part of the security contract: OB3LdpVerifier requires the JSON
# to be exactly the compacted form pyld derives from the signed dataset
# (context validation, GHSA-rp5q-966c-5592), and pyld 2.x compacts some terms
# differently (an Address `geo` comes back as `GeoCoordinates`), so genuine
# credentials such as 1EdTech's "Complete OpenBadgeCredential" example would be
# refused. pyld before 3.3 also canonicalizes an integral float (3.0) as
# "3.0E0" where 3.3 and jsonld.js give "3", so a proof made on one did not
# verify on the other.
# Ceiling below 4. RDF canonicalization of an untrusted document is factorial
# on a crafted blank-node graph and pyld 3.x has no work cap, so
# ob3/_canon_guard.py meters pyld's URDNA2015 itself; that guard is fitted to
# the 3.x implementation (it checks pyld's major version and canonicalizes a
# canary document at first use, and fails closed on a mismatch). pyld 4.0 is
# unreleased and breaking: it moves canon.py and the RDF types to rdflib, and
# toRDF starts dropping statements 3.x keeps (an IRI with two `#`, a literal
# with an invalid @language), which context validation, written against 3.x's
# absolute-IRI test, does not refuse: the signed dataset would lose what the
# JSON still says (GHSA-rp5q-966c-5592). Lift the ceiling only with both
# reworked and tested.
ldp = [
    "pyld>=3.3.0,<4",
]
# EUDI track: issue/verify badges as SD-JWT VC (the EU wallet / ARF format) via
# the generic openvc-core library. openvc-core is stable (1.x) with a published
# SemVer/deprecation contract, so the pin follows SemVer: floor at the version
# the suite is tested against, ceiling at the next major.
# See openbadgeslib/ob3/eudi.py.
# Functionally the track needs 1.22, where IETF Token Status List revocation
# (openvc.status.issue.build_token_status_reference, .token_status_list.
# check_token_status) landed. Among the security fixes since, 1.30.0 closes
# a false key_bound: verify_sd_jwt_vc() hands the caller's audience and nonce
# to openvc separately, and before 1.30.0 a Key Binding JWT checked against
# only one of them came back key_bound=True although it was never bound to
# this verifier. 1.30.0 refuses that half-configured check, and it also
# bounds untrusted JSON nesting so a deep document fails with a typed error,
# not a bare RecursionError. 1.35.0 starts enforcing the issuer JWT's own
# `aud` (RFC 7519 §4.1.3): before it, a third-party SD-JWT VC whose issuer
# restricted it to another relying party verified for everyone, and a status
# list token verified as unexpired under a hostile leeway_s. Per the rule
# above, the pin itself sits at 1.35.0, the release the suite is tested
# against, which also carries every openvc fix in between
# (GHSA-h9rq-wxcw-4rjc among them). Every extra that pulls openvc-core
# shares this one floor; the CI `eudi` job checks that they agree and runs
# the [eudi] and [ldp-sd] suites against it.
eudi = [
    "openvc-core>=1.35.0,<2",
]
# ecdsa-sd-2023 (selective disclosure) VERIFY for the OB 3.0 Data Integrity
# track: credentials secured with the ecdsa-sd-2023 cryptosuite are verified by
# delegating the large, security-sensitive selective-disclosure crypto to
# openvc-core's audited EcdsaSdProofSuite — openbadgeslib keeps the OB3 model,
# trust binding and lifecycle checks. Pulls openvc-core with its RDF
# canonicalization (pyld). Native eddsa-rdfc-2022 stays under [ldp]; issuance of
# ecdsa-sd-2023 is out of scope. See openbadgeslib/ob3/ldp.py.
# openvc-core 1.30.2 closes GHSA-vrxg-57v4-85mc for ecdsa-sd-2023, the suite
# delegated here: the proof signs the RDF dataset, the checks after it read
# the JSON, and before 1.30.2 nothing proved the JSON was the compacted form
# of what was signed, so a member re-keyed to its full IRI or moved under
# @included escaped them; 1.33.2 closes GHSA-h9rq-wxcw-4rjc (nested arrays,
# re-spelled policy terms, a derived proof merging blank nodes). The pin sits
# at 1.35.0, the shared tested floor
# described under [eudi]. OB3LdpVerifier also runs its own context validation
# (with pyld) before it delegates, and openvc-core[data-integrity] admits
# pyld 2.x (and, unbounded above, pyld 4), so this extra carries the same pyld
# range as [ldp].
ldp-sd = [
    "openvc-core[data-integrity]>=1.35.0,<2",
    "pyld>=3.3.0,<4",
]
# OID4VCI issuance: hand a badge to a wallet over the pre-authorized code flow.
# openbadgeslib owns the offers, the state (codes, tokens, nonces, grants) and
# the response bodies; the wallet key-proof cryptography is openvc-core's
# openvc.openid4vci, which first ships in openvc-core 1.23 — the substantive
# minimum here, with the pin itself at the tested release like every other
# openvc-core floor above. 1.25 also brings the discovery parsers this library
# now self-checks its issuer metadata and Credential Offers against
# (openbadgeslib/oid4vci/metadata.py and offer.py). 1.26 adds
# require_key_attestation= on verify_credential_request_proofs, so an
# issuer that advertises key_attestations_required can refuse a proof
# without one before the signature and before the nonce is spent. Those are
# the feature minimums; the pin is the shared 1.35.0 floor described under
# [eudi], which also applies 1.30.0's bound on untrusted JSON nesting to the
# Credential Requests and key proofs this extra hands to openvc.
#
# Everything except openbadgeslib/oid4vci/handler.py works without the extra,
# and the credential-endpoint tests skip themselves when the module is absent —
# so an install that does not ask for [oid4vci] is never broken by its absence.
# See openbadgeslib/oid4vci/ and wiki/Issuing-to-Wallets-with-OID4VCI.md.
oid4vci = [
    "openvc-core>=1.35.0,<2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "flake8>=7.0",
    "pdoc>=14",
    "mypy>=1.8",
    # Commit-message linting. Depend on gitlint-core, NOT the `gitlint`
    # meta-package: `gitlint` is an empty shim for gitlint-core[trusted-deps],
    # and that extra hard-pins click==8.1.3 / sh==1.14.3 — both now carry
    # advisories (PYSEC-2026-2132, command injection in click.edit(), fixed in
    # 8.3.3; CVE-2026-54552, incomplete privilege drop in sh's _uid, fixed in
    # 2.2.4) that turned the weekly Audit job red. Neither is reachable from
    # gitlint (it never calls click.edit(), and it does not import sh at all
    # unless GITLINT_USE_SH_LIB=1, which nothing here sets), but upstream has
    # been dormant since 2023 so no fixed release is coming. gitlint-core
    # declares the same dependencies loosely and still ships the `gitlint`
    # console script, so the command is unchanged; this is the workaround
    # gitlint's own installation docs recommend.
    "gitlint-core>=0.19",
    # Floors so the patched versions are a requirement, not a resolver accident;
    # ceilings because we now own these bounds and a dormant gitlint 0.19.1 is
    # unlikely to survive the next major of either. sh keeps gitlint-core's
    # platform marker: it is not installed on Windows, and the windows CI leg
    # installs [dev].
    "click>=8.3.3,<9",
    "sh>=2.2.4,<3; sys_platform != 'win32'",
    # Validates issued OB 3.0 credentials against the official 1EdTech JSON
    # Schemas (draft 2019-09); see tests/test_ob3_conformance_schema.py. The
    # format-nongpl extra activates the date-time/uri format checkers (via
    # rfc3339-validator etc.) so `format` keywords are asserted, not ignored —
    # and stays GPL-free, unlike the plain [format] extra.
    "jsonschema[format-nongpl]>=4.20",
]

[project.urls]
Homepage = "https://github.com/luisgf/openbadgeslib"
Documentation = "https://github.com/luisgf/openbadgeslib/wiki"
"API Reference" = "https://luisgf.github.io/openbadgeslib/"
Source = "https://github.com/luisgf/openbadgeslib"
Changelog = "https://github.com/luisgf/openbadgeslib/blob/master/Changelog.txt"

[project.scripts]
# Unified front-end (#234): `openbadges <command>` dispatches to the five tools
# below, which remain installed under their own names as aliases.
openbadges = "openbadgeslib.openbadges_cli:main"
openbadges-init = "openbadgeslib.openbadges_init:main"
openbadges-keygenerator = "openbadgeslib.openbadges_keygenerator:main"
openbadges-signer = "openbadgeslib.openbadges_signer:main"
openbadges-verifier = "openbadgeslib.openbadges_verifier:main"
openbadges-publish = "openbadgeslib.openbadges_publish:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openbadgeslib*"]

# Ship the PEP 561 marker so downstream type checkers use our annotations,
# and the pinned JSON-LD contexts the Data Integrity verifier canonicalizes
# against (see openbadgeslib/ob3/contexts/__init__.py for provenance).
[tool.setuptools.package-data]
openbadgeslib = ["py.typed"]
"openbadgeslib.ob3.contexts" = ["*.json"]

# Single source of truth for the version: openbadgeslib/util.py __version__.
# setuptools reads it by AST (no import), so it stays in sync automatically.
[tool.setuptools.dynamic]
version = { attr = "openbadgeslib.util.__version__" }

[tool.mypy]
python_version = "3.10"
files = ["openbadgeslib"]
# Full strict mode — the README advertises `mypy --strict`, so CI enforces it.
# (strict implies disallow_untyped_defs, disallow_any_generics, warn_return_any,
# no_implicit_optional, warn_unused_ignores, … — see `mypy --help`.)
strict = true

# Third-party dependencies that ship no type information.
[[tool.mypy.overrides]]
module = ["png.*", "defusedxml.*", "pyld.*"]
ignore_missing_imports = true

# openvc-core is behind the optional [eudi] extra and is not installed in the
# default (dev,ldp) type-check environment; ignore it when absent. It ships
# py.typed, so where installed its real types are still used.
[[tool.mypy.overrides]]
module = ["openvc.*", "openvc_ebsi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The conformance_docker suite drives 1EdTech's official validators as Docker
# services (network + DID resolution) — deselected by default so the local
# run and the release gate stay fast and hermetic. The nightly conformance
# workflow opts in with `pytest -m conformance_docker`.
addopts = "-m 'not conformance_docker'"
markers = [
    "conformance_docker: validates issued badges against the official 1EdTech validators running in Docker (opt-in; needs Docker, network)",
]

[tool.coverage.run]
source = ["openbadgeslib"]

[tool.coverage.report]
show_missing = true
# Freeze the coverage floor so a regression fails CI instead of slipping by in
# the log. The #169 targeted-coverage work took the total past 93% (dedicated
# baking/mail/keys tests, OB2 signer/verifier + OB3 LDP error branches, and
# openbadges_verifier.py 74% -> 95%); the floor is raised to 93 accordingly.
# pytest-cov honours this on the CI `pytest --cov` run.
fail_under = 93
exclude_lines = [
    "if __name__ == .__main__.:",
    "pass$",
]
