name: Audit

# Weekly dependency vulnerability scan (pip-audit). Separate from CI so it does
# not gate pushes/releases; it surfaces newly-disclosed advisories against the
# installed dependency tree. See #149.
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the package (with extras) and pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ldp,eudi]"
          pip install pip-audit

      - name: Audit installed dependencies
        # No ignores: the python-ecdsa Minerva advisory (PYSEC-2026-1325 /
        # CVE-2024-23342, wontfix upstream) that used to need one is gone with
        # the dependency itself (the cryptography port, #167).
        run: pip-audit
