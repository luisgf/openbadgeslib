name: CI

on:
  push:
    branches: [master]
    tags: ['v*']       # pushing a vX.Y.Z tag builds, tests, and publishes
  pull_request:
  release:
    types: [published]
  workflow_dispatch:   # manual "publish current master to PyPI" trigger

# Least-privilege default for GITHUB_TOKEN. The publish job re-declares its own
# permissions (adds `id-token: write` for PyPI Trusted Publishing); every other
# job only needs read (see #149).
permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        # ldp pulls pyld (Data Integrity tests) and eudi pulls openvc-core (the
        # SD-JWT VC tests); ldp-sd pulls openvc-core[data-integrity] for the
        # ecdsa-sd-2023 selective-disclosure verify tests; oid4vci pulls the
        # same openvc-core for the credential-endpoint suite — installed
        # explicitly so that suite can never pass by silently skipping
        # (#221, #312). The extra-absent behaviour is covered by monkeypatch
        # tests that run either way.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ldp,eudi,ldp-sd,oid4vci]"

      - name: Lint (flake8)
        run: flake8 openbadgeslib tests

      - name: Type check (mypy)
        run: mypy

      - name: Test (pytest + coverage)
        # This job installs [ldp-sd] and [oid4vci] on purpose, so demand them:
        # the ecdsa-sd-2023 suite and the credential-endpoint suite FAIL (not
        # skip) if openvc stops importing here (#221, #312). The windows leg
        # below omits those extras and does not set these, so it skips.
        env:
          OPENBADGES_REQUIRE_LDP_SD: '1'
          OPENBADGES_REQUIRE_OID4VCI: '1'
        run: pytest --cov=openbadgeslib --cov-report=term-missing

  windows:
    # "OS Independent" was only a classifier — nothing non-Linux was ever
    # exercised. On Windows fcntl is absent, so the StatusRegistry advisory lock
    # degrades to a no-op (status_registry.py:41-44,86-92), a path no Linux run
    # takes. Run the suite on windows-latest with the core extras only (the
    # [ldp]/[eudi] crypto tests skip when their wheels are absent), so nothing
    # Windows-specific silently rots. Independent of the publish gate (publish
    # `needs: test`), so a Windows-only quirk never blocks a release. See #230,
    # and the flock work in #148.
    name: test (windows, py${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies (core, no network extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test (pytest)
        run: pytest

  py315:
    # Advisory pre-release watch (#243). CPython 3.15.0 final slipped to
    # 2026-10-09 (PEP 790; rc3 on 2026-10-02); until then setup-python resolves
    # 3.15.0-rc.N through allow-prereleases, and `python-version: '3.15'` needs
    # no edit when the GA build lands — the flag only falls back to a
    # pre-release while a version line has no GA build. The 3.15 changes that
    # reach this code are argparse (`suggest_on_error` on by default), PEP 686
    # (UTF-8 mode) and the base64url deprecations.
    #
    # Deliberately a SEPARATE job rather than a leg of the `test` matrix, which
    # `publish` gates on (`needs: test`): a pre-release regression — or an
    # ecosystem wheel that has not shipped yet — must never be able to hold up a
    # release. Advisory twice over, then: continue-on-error, and outside the
    # publish gate. Same stance as the windows job above.
    #
    # Otherwise it runs exactly what a `test` leg runs: the same extras, the
    # same REQUIRE flags (a Data Integrity or OID4VCI suite that skips is a
    # failure, #221) and the same coverage gate. Until 2026-10 it installed
    # only [eudi]: lxml (via pyld) had no cp315 wheel, and neither had librt
    # (mypy) or MarkupSafe (pdoc). lxml 6.1.3, librt 0.16.0 and MarkupSafe
    # 3.0.4 now ship them. `--only-binary :all:` keeps the next missing wheel a
    # loud install failure instead of a silent source build.
    #
    # When 3.15.0 is GA: add '3.15' to the `test` matrix, delete this job and
    # add the trove classifier (that part is a `build:` change, #243).
    name: pre-release watch (py3.15, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.15 (pre-release)
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          # Only consulted while a version line has no GA build (today: 3.15).
          allow-prereleases: true
          cache: pip

      - name: Install package and dev dependencies (wheels only)
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary :all: -e ".[dev,ldp,eudi,ldp-sd,oid4vci]"

      - name: Record the resolved interpreter and dependency set
        run: |
          python -VV
          pip list

      - name: Lint (flake8)
        run: flake8 openbadgeslib tests

      - name: Type check (mypy)
        run: mypy

      - name: Test (pytest)
        env:
          OPENBADGES_REQUIRE_LDP_SD: '1'
          OPENBADGES_REQUIRE_OID4VCI: '1'
        run: pytest --cov=openbadgeslib --cov-report=term-missing

  eudi:
    # Hardening for the optional [eudi] SD-JWT VC track, which delegates its
    # crypto to openvc-core (a separate repo). The main `test` job installs the
    # extra alongside everything else; this job adds two guarantees it can't:
    #   * isolation — install ONLY [dev,eudi] (no ldp/pyld), proving the track
    #     stands on openvc-core alone;
    #   * version-drift — run against both the pinned floor and the latest
    #     openvc-core release, so an upstream bump fails here, not in a user's
    #     install.
    # Not a publish gate: the `latest` leg is an early warning
    # (continue-on-error); the `floor` leg — the version we ship against — is
    # authoritative. See #172.
    name: eudi extra (openvc-core ${{ matrix.openvc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openvc: [floor, latest]
    continue-on-error: ${{ matrix.openvc == 'latest' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install the package with only the [eudi] extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eudi]"

      - name: Pin openvc-core to the declared floor
        if: matrix.openvc == 'floor'
        # Read the floor out of pyproject.toml instead of restating it here.
        # The hardcoded "keep 1.18.* in sync" pin did NOT stay in sync: 677f4ed
        # raised the [eudi] floor to >=1.21 and touched only pyproject.toml, so
        # this — the authoritative leg — kept installing 1.18, downgrading below
        # the package's own constraint and leaving the shipped floor untested
        # (#264). Deriving it removes the thing that could drift.
        run: |
          floor="$(python - <<'PY'
          import pathlib, re, tomllib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text('utf-8'))
          spec = next(s for s in data['project']['optional-dependencies']['eudi']
                      if s.startswith('openvc-core'))
          print(re.search(r'>=\s*(\d+\.\d+)', spec).group(1))
          PY
          )"
          echo "Declared [eudi] openvc-core floor: $floor"
          pip install "openvc-core==${floor}.*"

      - name: Take the latest openvc-core release
        if: matrix.openvc == 'latest'
        run: pip install -U "openvc-core<2"

      - name: Record the resolved openvc-core version
        run: pip show openvc-core | grep '^Version:'

      - name: Test the EUDI SD-JWT VC track (isolated) and type-check it
        # Include the x5c trust-boundary tests: they assert the chain-validation
        # decisions openbadgeslib delegates to openvc-core (temporal validity,
        # SAN<->iss binding) and pin the revocation gap, so a drift in the
        # delegate's behaviour turns this floor/latest job red (#236).
        run: |
          pytest tests/test_ob3_eudi_sd_jwt.py tests/test_ob3_eudi_x5c.py -v
          mypy openbadgeslib/ob3/eudi.py

  publish:
    name: Publish to PyPI
    # Fires when a vX.Y.Z tag is pushed, when a GitHub Release is published, or
    # on a manual workflow_dispatch — and only if the whole test matrix above
    # succeeded ("si todo ha ido bien"). Pushing the tag is enough; a GitHub
    # Release is optional (for release notes). skip-existing makes a double
    # trigger (tag + Release for the same version) a harmless no-op.
    needs: test
    if: >-
      github.event_name == 'release'
      || github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read       # checkout the tag
      id-token: write      # OIDC Trusted Publishing — no long-lived token
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        # SHA-pinned (not the mutable release/v1 branch): this step runs with
        # id-token: write, so a compromised upstream ref could publish under our
        # OIDC identity. Dependabot (.github/dependabot.yml) bumps the pin.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          # OIDC Trusted Publishing: no password — the id-token permission
          # above authenticates to PyPI. This REQUIRES a Trusted Publisher
          # configured on the PyPI project (GitHub Actions, workflow ci.yml);
          # without it the publish fails. See #149.
          skip-existing: true
