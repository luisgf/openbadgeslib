name: CI

on:
  push:
    branches: [master]
    tags: ['v*']       # pushing a vX.Y.Z tag builds, tests, and publishes
  pull_request:
  release:
    types: [published]
  workflow_dispatch:   # manual "publish current master to PyPI" trigger

# Least-privilege default for GITHUB_TOKEN. The publish job re-declares its own
# permissions (adds `id-token: write` for PyPI Trusted Publishing); every other
# job only needs read (see #149).
permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        # ldp pulls pyld (Data Integrity tests) and eudi pulls openvc-core
        # (the SD-JWT VC tests); both importorskip without their extra, and the
        # extra-absent behaviour is covered by monkeypatch tests that run either way.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ldp,eudi]"

      - name: Lint (flake8)
        run: flake8 openbadgeslib tests

      - name: Type check (mypy)
        run: mypy

      - name: Test (pytest + coverage)
        run: pytest --cov=openbadgeslib --cov-report=term-missing

  eudi:
    # Hardening for the optional [eudi] SD-JWT VC track, which delegates its
    # crypto to openvc-core (a separate repo). The main `test` job installs the
    # extra alongside everything else; this job adds two guarantees it can't:
    #   * isolation — install ONLY [dev,eudi] (no ldp/pyld), proving the track
    #     stands on openvc-core alone;
    #   * version-drift — run against both the pinned floor and the latest
    #     openvc-core release, so an upstream bump fails here, not in a user's
    #     install.
    # Not a publish gate: the `latest` leg is an early warning
    # (continue-on-error); the `floor` leg — the version we ship against — is
    # authoritative. See #172.
    name: eudi extra (openvc-core ${{ matrix.openvc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openvc: [floor, latest]
    continue-on-error: ${{ matrix.openvc == 'latest' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install the package with only the [eudi] extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eudi]"

      - name: Pin openvc-core to the declared floor
        if: matrix.openvc == 'floor'
        # Keep 1.18.* in sync with the [eudi] pin in pyproject.toml.
        run: pip install "openvc-core==1.18.*"

      - name: Take the latest openvc-core release
        if: matrix.openvc == 'latest'
        run: pip install -U "openvc-core<2"

      - name: Record the resolved openvc-core version
        run: pip show openvc-core | grep '^Version:'

      - name: Test the EUDI SD-JWT VC track (isolated) and type-check it
        run: |
          pytest tests/test_ob3_eudi_sd_jwt.py -v
          mypy openbadgeslib/ob3/eudi.py

  publish:
    name: Publish to PyPI
    # Fires when a vX.Y.Z tag is pushed, when a GitHub Release is published, or
    # on a manual workflow_dispatch — and only if the whole test matrix above
    # succeeded ("si todo ha ido bien"). Pushing the tag is enough; a GitHub
    # Release is optional (for release notes). skip-existing makes a double
    # trigger (tag + Release for the same version) a harmless no-op.
    needs: test
    if: >-
      github.event_name == 'release'
      || github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read       # checkout the tag
      id-token: write      # OIDC Trusted Publishing — no long-lived token
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # OIDC Trusted Publishing: no password — the id-token permission
          # above authenticates to PyPI. This REQUIRES a Trusted Publisher
          # configured on the PyPI project (GitHub Actions, workflow ci.yml);
          # without it the publish fails. See #149.
          skip-existing: true
