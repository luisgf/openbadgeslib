# Read the Docs build configuration.
# The project's narrative docs live in the GitHub Wiki; this builds the API
# reference (the same pdoc site published to GitHub Pages) so it is also served
# at openbadgeslib.readthedocs.io. See https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - pip install -e ".[dev]"
    - pdoc openbadgeslib -o "$READTHEDOCS_OUTPUT/html" -d google
